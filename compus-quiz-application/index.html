<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

    <header>
        <div class="knowledge_logo logo"></div>
        <div class="brain_logo logo"></div>
        <h1>Quiz Application</h1>
    </header>
    <section class="Result" style="display: none;">
        <h2 class="result-heading">🎉 Quiz Complete! 🎉</h2>
        <p class="correct">correct: </p>
        <p class="wrong">wrong : </p>
        <p class="Result-perc">Result-percentage : </p>
        <p class="result-message">Result Message : </p>
    </section>
    <main>
        <section class="hero">

            <div class="Quest_count">
                <p class="Question_no">Questions</p>
                <div class="timer">⏰ 00:00:00
</div>
            </div>

            <div class="progress_bar">
                <progress class="progress" value="1" max="100"></progress>
            </div>

            <div class="percent">
                <p class="Remaining">1%</p>
                <p class="Total">100%</p>
            </div>

        </section>

        <section class="Questions" >
            <div class="statement">What is the capital of france?</div>
            <div class="options" id="0">
                <div></div>
                <span class="option-text">option1</span>
                </div>
            <div class="options" id="1">
                <div></div>
                <span class="option-text">option2</span>
                </div>
            <div class="options" id="2"> 
                <div></div>
                <span class="option-text">option3</span>
                </div>
            <div class="options" id="3">
                <div></div>
                <span class="option-text">option4</span>
                </div>
        </section>

    </main>

    <footer>
        <button class="button" onclick="{GoToNext()}">Next Question</button>
    </footer>
    
    </div>
    <script src="script.js"></script>
</body>
</html>
