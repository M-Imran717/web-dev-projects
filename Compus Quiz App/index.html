<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

    <header>
        <div class="knowledge_logo logo"></div>
        <div class="brain_logo logo"></div>
        <h1>Quiz Application</h1>
    </header>

    <main>
        <section class="hero">

            <div class="Quest_count">
                <p class="Question_no">Question 1 of 5</p>
                <div class="timer">⏰ 00:15
</div>
            </div>

            <div class="progress_bar">
                <progress value="1" max="5"></progress>
            </div>

            <div class="percent">
                <p class="Remaining">1%</p>
                <p class="Total">100%</p>
            </div>

        </section>

        <section class="Questions" >
            <div class="statement">What is the capital of france?</div>
            <div class="options option1">
                <div></div>
                option1</div>
            <div class="options option2">
                <div></div>
                 option2</div>
            <div class="options option3"> 
                <div></div>
                option3</div>
            <div class="options option4">
                <div></div>
                 option4</div>
        </section>

    </main>

    <footer>
        <button class="button">Next Question</button>
    </footer>
    
    </div>
    <script src="script.js"></script>
</body>
</html>
